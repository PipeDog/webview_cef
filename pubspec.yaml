name: webview_cef
description: Flutter Desktop Webview backed by CEF (Chromium Embedded Framework).
version: 0.5.1
homepage: https://github.com/hlwhl/webview_cef
repository: https://github.com/hlwhl/webview_cef

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Native media player backend (libmdk). Used by the media player takeover
  # feature to play media formats (MP3/MP4/HLS...) that the Spotify CEF build
  # cannot decode. See media_player_design.md.
  fvp: ^0.37.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: WebviewCefPlugin
      windows:
        pluginClass: WebviewCefPluginCApi
      linux:
        pluginClass: WebviewCefPlugin
      elinux:
        pluginClass: WebviewCefPlugin
