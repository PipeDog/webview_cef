<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>iframe JSBridge 测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
    }

    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 22px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.15rem;
      color: #e94560;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.78rem;
      color: #a0a0b0;
      margin-bottom: 14px;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: #2a2a4a;
      color: #a0a0b0;
      white-space: nowrap;
    }

    .badge.ok {
      background: #1a6b3c;
      color: #fff;
    }

    .badge.fail {
      background: #7a2a2a;
      color: #fff;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:active {
      opacity: 0.7;
    }

    .btn-console {
      background: #533483;
      color: #fff;
    }

    .btn-channel {
      background: #e94560;
      color: #fff;
    }

    .btn-eval {
      background: #0f3460;
      color: #fff;
    }

    .btn-parent {
      background: #1a7f8e;
      color: #fff;
    }

    .btn-clear {
      background: #2a2a4a;
      color: #a0a0b0;
    }

    .section {
      margin-top: 14px;
    }

    .section-label {
      font-size: 0.78rem;
      color: #a0a0b0;
      margin-bottom: 6px;
    }

    #log-area {
      margin-top: 16px;
      background: #0d0d1a;
      border-radius: 8px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.72rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-line {
      border-bottom: 1px solid #1a1a2e;
      padding: 2px 0;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>iframe JSBridge 测试</h1>
    <p class="subtitle">作为 iframe 加载在 bridge.html 内部 — 同一个 CEF webview，独立的 frame 上下文</p>

    <div class="badge-row">
      <span class="badge" id="badge-cef">$cef: 检测中…</span>
      <span class="badge" id="badge-abc">abc(): 检测中…</span>
    </div>

    <div class="btn-group">
      <button class="btn-console" onclick="testConsole()">
        &#x1F4AC; console.log（iframe）
      </button>
      <button class="btn-channel" onclick="testChannel()">
        &#x1F4E8; $cef.Print.postMessage（iframe）
      </button>
      <button class="btn-eval" onclick="testEval()">
        &#x26A1; abc('iframe_test')（iframe）
      </button>
      <button class="btn-parent" onclick="sendToParent()">
        &#x1F4E4; postMessage &#8594; 父页面
      </button>
      <button class="btn-clear" onclick="clearLog()">
        &#x1F5D1; 清空日志
      </button>
    </div>

    <div class="section">
      <p class="section-label">父页面 &#8594; iframe：从 bridge.html 发送一条消息，会在下方回显。</p>
    </div>

    <div id="log-area"></div>
  </div>

  <script>
    const logArea = document.getElementById('log-area');

    function appendLog(tag, msg) {
      const t = new Date().toLocaleTimeString();
      logArea.innerHTML += `<div class="log-line">[${t}] <b>${tag}</b>: ${msg}</div>`;
      logArea.scrollTop = logArea.scrollHeight;
    }

    // 将事件上报给父页面（bridge.html），由它显示在自己的日志区。
    // 保持 payload 最小化：{__src, tag, msg}。
    function reportToParent(tag, msg) {
      try {
        parent.postMessage({ __src: 'iframe-test', tag: tag, msg: msg }, '*');
      } catch (e) {
        appendLog('Parent', 'postMessage 给父页面失败: ' + e);
      }
    }

    function clearLog() {
      logArea.innerHTML = '';
      appendLog('UI', '日志已清空');
    }

    // ── 1. 在 iframe 上下文中调用 console.log ──────
    function testConsole() {
      console.log('hello_from_iframe_console');
      appendLog('Console', '<code>console.log("hello_from_iframe_console")</code> 已发送');
      reportToParent('Console', 'iframe console.log 已发送 — 检查 CEF 是否将其转发到应用日志');
    }

    // ── 2. 在 iframe 上下文中使用 $cef.Print 通道 ─
    function testChannel() {
      if (typeof $cef !== 'undefined' && typeof $cef.Print !== 'undefined') {
        $cef.Print.postMessage(JSON.stringify({ msg: 'hello_from_iframe_channel' }));
        appendLog('Channel', '<code>$cef.Print.postMessage(...)</code> 已发送');
        reportToParent('Channel', 'iframe 的 <code>$cef.Print.postMessage</code> 已发送');
      } else {
        appendLog('Channel', '<span style="color:#e94560">iframe 上下文中 $cef.Print 不可用</span>');
        reportToParent('Channel', '失败 — iframe 上下文中 <code>$cef.Print</code> 不可用');
      }
    }

    // ── 3. abc()（主 frame 注入的函数） ──────
    function testEval() {
      if (typeof abc === 'function') {
        var result = abc('iframe_test');
        appendLog('Eval', '<code>abc("iframe_test")</code> → <b>' + result + '</b>');
        reportToParent('Eval', 'iframe 的 <code>abc("iframe_test")</code> → <b>' + result + '</b>');
      } else {
        appendLog('Eval', '<span style="color:#e94560">iframe 上下文中 abc() 未定义</span>');
        reportToParent('Eval', '失败 — iframe 上下文中 <code>abc()</code> 未定义');
      }
    }

    // ── 4. 窗口消息：iframe → 父页面 ─────────
    function sendToParent() {
      parent.postMessage({ __src: 'iframe-test', tag: 'Iframe', msg: 'hello_from_iframe_to_parent' }, '*');
      appendLog('Parent', 'postMessage → 父页面已发送');
    }

    // ── 5. 父页面 → iframe 窗口消息 ──────────
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (d && d.__src === 'bridge') {
        appendLog('Parent', '收到来自父页面的消息: <code>' + d.msg + '</code>');
        // 回显给父页面，以便 bridge.html 确认往返通信。
        reportToParent('Iframe', '回显: <code>' + d.msg + '</code>');
      }
    });

    // ── 启动：检测本 frame 中的 bridge 可用性 ─
    (function boot() {
      var hasCef = typeof $cef !== 'undefined';
      var hasAbc = typeof abc === 'function';

      var cefBadge = document.getElementById('badge-cef');
      cefBadge.textContent = '$cef: ' + (hasCef ? '可用' : '不可用');
      cefBadge.className = 'badge ' + (hasCef ? 'ok' : 'fail');

      var abcBadge = document.getElementById('badge-abc');
      abcBadge.textContent = 'abc(): ' + (hasAbc ? '可用' : '不可用');
      abcBadge.className = 'badge ' + (hasAbc ? 'ok' : 'fail');

      appendLog('Boot', 'iframe 已加载 — $cef: ' + (hasCef ? 'YES' : 'NO')
        + ', abc(): ' + (hasAbc ? 'YES' : 'NO'));
      reportToParent('Boot', 'iframe 已加载 — $cef: ' + (hasCef ? 'YES' : 'NO')
        + ', abc(): ' + (hasAbc ? 'YES' : 'NO'));
    })();
  </script>
</body>

</html>
