<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>JSBridge 测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.6rem;
      color: #e94560;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #a0a0b0;
      margin-bottom: 28px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:active {
      opacity: 0.7;
    }

    .btn-console {
      background: #533483;
      color: #fff;
    }

    .btn-channel {
      background: #e94560;
      color: #fff;
    }

    .btn-eval {
      background: #0f3460;
      color: #fff;
    }

    .btn-clear {
      background: #2a2a4a;
      color: #a0a0b0;
    }

    .btn-media {
      background: #1a6b3c;
      color: #fff;
    }

    .btn-html5test {
      background: #e67e22;
      color: #fff;
    }

    .btn-xdf {
      background: #8e44ad;
      color: #fff;
    }

    .btn-iframe {
      background: #1a7f8e;
      color: #fff;
    }

    .section {
      margin-top: 20px;
    }

    .section-label {
      font-size: 0.8rem;
      color: #a0a0b0;
      margin-bottom: 6px;
    }

    #log-area {
      margin-top: 24px;
      background: #0d0d1a;
      border-radius: 8px;
      padding: 14px;
      max-height: 260px;
      overflow-y: auto;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-line {
      border-bottom: 1px solid #1a1a2e;
      padding: 3px 0;
    }
    .file-row { display: flex; gap: 8px; align-items: center; }
    .btn-file {
      background: #1a6b3c; color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; white-space: nowrap;
    }
    .btn-file:hover { opacity: 0.85; }
    .btn-file:active { opacity: 0.7; }
    #file-name { font-size: 0.78rem; color: #a0a0b0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #file-info { margin-top: 6px; font-size: 0.75rem; color: #707088; min-height: 1em; }
  </style>
</head>

<body>
  <div class="card">
    <h1>&#x26A1; JSBridge 功能检查</h1>
    <p class="subtitle">CEF WebView — 控制台 · 通道 · 求值</p>

    <div class="btn-group">
      <button class="btn-console" onclick="testConsole()">
        &#x1F4AC; 1. console.log
      </button>
      <button class="btn-channel" onclick="testChannel()">
        &#x1F4E8; 2. Print 通道
      </button>
      <button class="btn-eval" onclick="testEval()">
        &#x26A1; 3. evaluateJavascript
      </button>
      <button class="btn-clear" onclick="clearLog()">
        &#x1F5D1; 清空日志
      </button>
      <button class="btn-media" onclick="location.href='media-test.html'">
        &#x1F3AC; 媒体播放测试
      </button>
      <button class="btn-html5test" onclick="location.href='https://html5test.com/'">
        &#x1F310; HTML5 测试
      </button>
      <button class="btn-xdf" onclick="location.href='https://ckai-teacher-web-test1.test.xdf.cn/in-class?contentId=blank&amp;contentType=BLANK&amp;role=teacher-lecture&amp;roomId=bc45ecd9b70446bf8b4782491c7c98d0&amp;wbRoomId=bc45ecd9b70446bf8b4782491c7c98d0@blank'">
        &#x1F3EB; 新东方 课堂测试
      </button>
      <button class="btn-iframe" onclick="toggleIframe()">
        &#x1F5BC; iframe 测试
      </button>
    </div>

    <div class="section">
      <p class="section-label">键盘快捷键测试</p>
      <textarea id="shortcut-test" placeholder="在此输入并测试 Cmd+方向键、Cmd+Z、Cmd+Backspace..." style="width:100%;height:120px;background:#0d0d1a;color:#e0e0e0;
          border:1px solid #2a2a4a;border-radius:8px;padding:10px;
          font-family:'SF Mono','Fira Code',monospace;font-size:0.85rem;
          resize:vertical;"></textarea>
    </div>

    <div class="section">
      <p class="section-label">文件选择测试</p>
      <div class="file-row">
        <input type="file" id="file-input" style="display:none" onchange="onFileSelected(this.files)" />
        <button class="btn-file" onclick="document.getElementById('file-input').click()">
          &#x1F4C2; 选择文件
        </button>
        <span id="file-name">未选择文件</span>
      </div>
      <div id="file-info"></div>
    </div>

    <div class="section" id="iframe-section" style="display:none">
      <p class="section-label">iframe JSBridge 测试（iframe-test.html）</p>
      <div class="file-row">
        <input type="text" id="iframe-msg" value="来自父页面的问候"
          style="flex:1;background:#0d0d1a;color:#e0e0e0;border:1px solid #2a2a4a;border-radius:8px;padding:8px 10px;font-size:0.85rem;" />
        <button class="btn-file" onclick="sendToIframe()">发送 &#8595;</button>
      </div>
      <iframe id="iframe-test" src="iframe-test.html"
        style="width:100%;height:420px;border:1px solid #2a2a4a;border-radius:8px;margin-top:8px;background:#0d0d1a;"></iframe>
    </div>

    <div id="log-area"></div>
  </div>

  <script>
    const logArea = document.getElementById('log-area');

    function appendLog(tag, msg) {
      const t = new Date().toLocaleTimeString();
      logArea.innerHTML += `<div class="log-line">[${t}] <b>${tag}</b>: ${msg}</div>`;
      logArea.scrollTop = logArea.scrollHeight;
    }

    function clearLog() {
      logArea.innerHTML = '';
      appendLog('UI', '日志已清空');
    }

    // ── 1. console.log ──────────────────────────────
    function testConsole() {
      console.log('hello_from_console_log');
      appendLog('Console', '<code>console.log("hello_from_console_log")</code> 已发送');
    }

    // ── 2. Print JavaScriptChannel ──────────────────
    function testChannel() {
      if (typeof $cef !== 'undefined' && typeof $cef.Print !== 'undefined') {
        $cef.Print.postMessage(JSON.stringify({ msg: 'hello_from_print_channel' }));
        appendLog('Channel', '<code>$cef.Print.postMessage(...)</code> 已发送');
      } else {
        appendLog('Channel', '<span style="color:#e94560">$cef.Print 通道未注册</span>');
      }
    }

    // ── 3. evaluateJavascript（abc 函数） ────────
    function testEval() {
      if (typeof abc === 'function') {
        var result = abc('bridge_test');
        appendLog('Eval', '<code>abc("bridge_test")</code> → <b>' + result + '</b>');
      } else {
        appendLog('Eval', '<span style="color:#e94560">abc() 未定义</span>');
      }
    }

    // ── 4. 文件选择 ──────────────────────────────
    function onFileSelected(files) {
      var el = document.getElementById('file-name');
      var info = document.getElementById('file-info');
      if (!files || files.length === 0) {
        el.textContent = '未选择文件';
        info.textContent = '';
        return;
      }
      var f = files[0];
      var size = f.size < 1024 ? f.size + ' B'
        : f.size < 1048576 ? (f.size / 1024).toFixed(1) + ' KB'
        : (f.size / 1048576).toFixed(2) + ' MB';
      el.textContent = f.name;
      info.textContent = '类型: ' + (f.type || '未知') + '  |  大小: ' + size;
      appendLog('File', '<b>' + f.name + '</b> — ' + size + ' (' + (f.type || '未知') + ')');

      // 以文本形式读取文件内容（最多 4 KB）并显示预览。
      if (f.size <= 4096) {
        var reader = new FileReader();
        reader.onload = function(e) {
          appendLog('File', '内容预览: <pre style="margin:4px 0 0 0;font-size:0.72rem;opacity:0.8">'
            + e.target.result + '</pre>');
        };
        reader.readAsText(f);
      } else {
        appendLog('File', '文件过大，无法预览（>4 KB）');
      }
    }

    // ── 5. iframe JSBridge 测试 ──────────────────────
    function toggleIframe() {
      var sec = document.getElementById('iframe-section');
      var show = sec.style.display === 'none';
      sec.style.display = show ? 'block' : 'none';
      appendLog('Iframe', show ? '已在下方嵌入 iframe-test.html' : 'iframe 区域已隐藏');
    }

    function sendToIframe() {
      var input = document.getElementById('iframe-msg');
      var text = input.value || '来自父页面的问候';
      var frame = document.getElementById('iframe-test');
      frame.contentWindow.postMessage({ __src: 'bridge', msg: text }, '*');
      appendLog('Iframe', '&#8594; 已发送到 iframe: <code>' + text + '</code>');
    }

    // 接收 iframe-test.html 上报的消息。iframe 会运行自己的
    // bridge 测试（console / $cef.Print / abc）并把结果上报到这里。
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (d && d.__src === 'iframe-test') {
        appendLog('Iframe' + (d.tag ? '.' + d.tag : ''), d.msg);
      }
    });

    // 启动日志
    appendLog('Init', 'bridge.html 已加载');
    console.log('bridge.html ready');
  </script>
</body>

</html>
